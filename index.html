<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jadwal & Kegiatan Harian</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857' }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-24 select-none">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
        <span>📅</span> Jadwal Harian
      </h1>
      <p id="displayCurrentDate" class="text-xs text-slate-400 mt-0.5">Memuat tanggal...</p>
    </div>
    <div class="flex items-center gap-2">
      <input type="date" id="datePicker" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-brand-500">
    </div>
  </header>

  <!-- Progress Bar Ringkas -->
  <main class="max-w-md mx-auto px-4 pt-4">
    <div class="bg-gradient-to-br from-slate-800 to-slate-850 border border-slate-750 p-4 rounded-2xl mb-4 shadow-lg flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Capaian Hari Ini</p>
        <h2 id="progressSummary" class="text-xl font-extrabold text-white mt-0.5">0 / 0 Kegiatan</h2>
        <p id="progressPercentText" class="text-xs text-emerald-400 mt-1 font-medium">0% selesai</p>
      </div>
      <div class="w-14 h-14 relative flex items-center justify-center">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
          <path class="text-slate-700" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path id="progressCircle" class="text-emerald-500 transition-all duration-300" stroke-dasharray="0, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
      </div>
    </div>

    <!-- Filter Tab Kategori -->
    <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar text-xs">
      <button onclick="setFilter('Semua')" id="filter-Semua" class="filter-btn px-3.5 py-1.5 rounded-full bg-emerald-500 text-white font-medium shadow-sm transition">Semua</button>
      <button onclick="setFilter('Mengajar')" id="filter-Mengajar" class="filter-btn px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 transition">Mengajar</button>
      <button onclick="setFilter('Kuliah')" id="filter-Kuliah" class="filter-btn px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 transition">Kuliah</button>
      <button onclick="setFilter('Ibadah')" id="filter-Ibadah" class="filter-btn px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 transition">Ibadah</button>
      <button onclick="setFilter('Pribadi')" id="filter-Pribadi" class="filter-btn px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 transition">Pribadi</button>
    </div>

    <!-- Daftar Kegiatan -->
    <div class="mt-3">
      <div id="activityList" class="space-y-2.5">
        <!-- Rendered via JS -->
      </div>
      <div id="emptyState" class="hidden text-center py-12">
        <p class="text-3xl mb-2">📋</p>
        <p class="text-sm text-slate-400">Belum ada agenda pada tanggal ini.</p>
        <p class="text-xs text-slate-500 mt-1">Tekan tombol (+) di kanan bawah untuk menambah agenda.</p>
      </div>
    </div>
  </main>

  <!-- Tombol Tambah Floating (FAB) -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white rounded-full flex items-center justify-center shadow-xl shadow-emerald-500/30 transition-all z-40">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
    </svg>
  </button>

  <!-- Modal Tambah Agenda -->
  <div id="taskModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-slate-850 border border-slate-750 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 bg-slate-800 animate-in slide-in-from-bottom-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-white">Tambah Kegiatan</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <form id="taskForm" onsubmit="saveTask(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Nama Kegiatan</label>
          <input type="text" id="taskName" required placeholder="Contoh: Mengajar MA Kelas 10 / Kuliah S2" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500 text-xs">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Jam Mulai</label>
            <input type="time" id="taskTime" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500 text-xs">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Kategori</label>
            <select id="taskCategory" class="w-full bg-slate-900 border border-slate-750 border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500 text-xs">
              <option value="Mengajar">Mengajar</option>
              <option value="Kuliah">Kuliah & Riset</option>
              <option value="Ibadah">Ibadah & Wirid</option>
              <option value="Pribadi">Pribadi / Proyek</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Keterangan / Lokasi (Opsional)</label>
          <input type="text" id="taskNote" placeholder="Contoh: Ruang Kelas B / Gedung Pascasarjana" class="w-full bg-slate-900 border border-slate-750 border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500 text-xs">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-750 border-slate-700 text-slate-300 font-semibold hover:bg-slate-700 transition">Batal</button>
          <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-emerald-500 text-white font-semibold hover:bg-emerald-600 transition shadow-lg shadow-emerald-500/20">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Inisialisasi Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW error:', err));
      });
    }

    let activeFilter = 'Semua';
    let selectedDate = new Date().toISOString().split('T')[0];

    // Format Tanggal Indonesia
    function formatIndoDate(dateStr) {
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('id-ID', options);
    }

    // Ambil Data dari LocalStorage
    function getStoredTasks() {
      return JSON.parse(localStorage.getItem('my_daily_tasks') || '[]');
    }

    function saveStoredTasks(tasks) {
      localStorage.setItem('my_daily_tasks', JSON.stringify(tasks));
      render();
    }

    function openModal() {
      document.getElementById('taskModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('taskModal').classList.add('hidden');
      document.getElementById('taskForm').reset();
    }

    function saveTask(e) {
      e.preventDefault();
      const name = document.getElementById('taskName').value.trim();
      const time = document.getElementById('taskTime').value;
      const category = document.getElementById('taskCategory').value;
      const note = document.getElementById('taskNote').value.trim();

      const newTask = {
        id: Date.now().toString(),
        date: selectedDate,
        name,
        time,
        category,
        note,
        completed: false
      };

      const tasks = getStoredTasks();
      tasks.push(newTask);
      saveStoredTasks(tasks);
      closeModal();
    }

    function toggleTask(id) {
      const tasks = getStoredTasks();
      const idx = tasks.findIndex(t => t.id === id);
      if (idx !== -1) {
        tasks[idx].completed = !tasks[idx].completed;
        saveStoredTasks(tasks);
      }
    }

    function deleteTask(id) {
      if (confirm('Hapus kegiatan ini?')) {
        const tasks = getStoredTasks().filter(t => t.id !== id);
        saveStoredTasks(tasks);
      }
    }

    function setFilter(cat) {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = 'filter-btn px-3.5 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 transition';
      });
      document.getElementById('filter-' + cat).className = 'filter-btn px-3.5 py-1.5 rounded-full bg-emerald-500 text-white font-medium shadow-sm transition';
      render();
    }

    function render() {
      document.getElementById('displayCurrentDate').innerText = formatIndoDate(selectedDate);
      document.getElementById('datePicker').value = selectedDate;

      const tasks = getStoredTasks()
        .filter(t => t.date === selectedDate)
        .sort((a, b) => a.time.localeCompare(b.time));

      const filtered = activeFilter === 'Semua' ? tasks : tasks.filter(t => t.category === activeFilter);

      // Hitung Progres
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('progressSummary').innerText = `${completed} / ${total} Kegiatan`;
      document.getElementById('progressPercentText').innerText = `${pct}% selesai`;
      document.getElementById('progressCircle').setAttribute('stroke-dasharray', `${pct}, 100`);

      const listEl = document.getElementById('activityList');
      const emptyEl = document.getElementById('emptyState');
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
        filtered.forEach(item => {
          const badgeColors = {
            'Mengajar': 'bg-emerald-950/70 text-emerald-400 border-emerald-800/60',
            'Kuliah': 'bg-blue-950/70 text-blue-400 border-blue-800/60',
            'Ibadah': 'bg-amber-950/70 text-amber-400 border-amber-800/60',
            'Pribadi': 'bg-purple-950/70 text-purple-400 border-purple-800/60'
          };
          const badgeClass = badgeColors[item.category] || 'bg-slate-800 text-slate-300 border-slate-700';

          const card = document.createElement('div');
          card.className = `p-3.5 rounded-xl border transition flex items-center justify-between gap-3 ${item.completed ? 'bg-slate-850/60 border-slate-800 opacity-60' : 'bg-slate-800 border-slate-700'}`;
          card.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden cursor-pointer" onclick="toggleTask('${item.id}')">
              <input type="checkbox" ${item.completed ? 'checked' : ''} class="w-5 h-5 rounded accent-emerald-500 cursor-pointer">
              <div class="truncate">
                <p class="text-sm font-semibold ${item.completed ? 'line-through text-slate-400' : 'text-slate-100'} truncate">${item.name}</p>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-[11px] font-mono text-slate-400 font-medium">${item.time}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-md border font-medium ${badgeClass}">${item.category}</span>
                  ${item.note ? `<span class="text-[11px] text-slate-400 truncate max-w-[120px]">• ${item.note}</span>` : ''}
                </div>
              </div>
            </div>
            <button onclick="deleteTask('${item.id}')" class="text-slate-500 hover:text-rose-400 p-1.5 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          `;
          listEl.appendChild(card);
        });
      }
    }

    document.getElementById('datePicker').addEventListener('change', (e) => {
      selectedDate = e.target.value;
      render();
    });

    // Inisialisasi awal
    render();
  </script>
</body>
</html>
